# Zephyr — fuzzel launcher.
# Colors below match Catppuccin Mocha; zephyr-theme rewrites them on theme switch.

[main]
font=JetBrains Mono:size=12
prompt="> "
icons-enabled=yes
terminal=foot
lines=10
width=40
horizontal-pad=12
vertical-pad=10
inner-pad=8
show-actions=no

[border]
width=1
radius=8
color=89b4fa

[colors]
background=1e1e2eff
text=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
border=89b4faff

[dmenu]
exit-immediately-if-empty=yes
