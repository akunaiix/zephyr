# Zephyr — mako notification daemon.
# Colors match Catppuccin Mocha; zephyr-theme rewrites them on theme switch.

font=JetBrains Mono 11
width=380
height=140
margin=12
padding=12
border-size=1
border-radius=8
anchor=top-right
default-timeout=6000
ignore-timeout=0
max-visible=5
layer=overlay

background-color=#282828
text-color=#ebdbb2
border-color=#fabd2f
progress-color=over #313244

[urgency=low]
border-color=#fabd2f
default-timeout=4000

[urgency=normal]
border-color=#fabd2f

[urgency=critical]
border-color=#fabd2f
default-timeout=0
