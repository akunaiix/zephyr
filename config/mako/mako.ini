# Zephyr — mako notification daemon.
# Colors match Catppuccin Mocha; zephyr-theme rewrites them on theme switch.

font=JetBrains Mono 11
width=380
height=140
margin=12
padding=12
border-size=1
border-radius=8
anchor=top-right
default-timeout=6000
ignore-timeout=0
max-visible=5
layer=overlay

background-color=#1e1e2e
text-color=#cdd6f4
border-color=#89b4fa
progress-color=over #313244

[urgency=low]
border-color=#45475a
default-timeout=4000

[urgency=normal]
border-color=#89b4fa

[urgency=critical]
border-color=#f38ba8
default-timeout=0
